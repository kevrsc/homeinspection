name: Web CI

on:
  push:
    paths:
      - 'homeinspection-web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'homeinspection-web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homeinspection-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: homeinspection-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
